<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Project Wibsite</title>
    <style>
        *{
            font-family:  Arial, sans-serif;
            margin:0;
        }
        .navbar{
            background: black ;
            color: white;
        }
        a{color: aliceblue;}
        .main-nav{
            list-style: none;
            display: flex;
        }
        .main-nav li{
            margin: 20px;
        }
        .main-nav li a{
            text-decoration: none;
            color: white;

        }
        .cover{
            width: 100%;
            background: blue;
            height: 50vh;
            align-items: center;
            display: flex;
            justify-content: center;
        }.cover img {
            width:100%;
            object-fit: cover;
            height: 50vh;
        }
        .text-title{
            text-align: center ;
            margin: 20px;
        }
        .technology-contenner{
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(250px,1fr));
            gap: 20px;
        }
        .technology-contenner.box{
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 20px;
        }
        .technology-contenner.box img{
            width: 100%;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <ul class="main-nav">
            <li><a href="">Home</a></li>
            <li><a href="">Products</a></li>
            <li><a href="">Suport</a></li>
            <li><a href="">Contact</a></li>
        </ul>
    </nav>
    <div class="cover">
        <img src="Images/image.png" alt="">
    </div>
    <div class="technology">
        <h2 class="text-title">Technologies </h2>
        <div class="technology-contenner">
            <div class="box"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-rUHJT-BCkQ2y8FfSL9ZZJ0YAXZOP2FndwZpt7y7-Nw&s=10" alt=""></div>
            <div class="box"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQESTOE5VSRkt89qNAkoJU1B7ukZl5hjrZAt_MzydZ__w&s" alt=""></div>
            <div class="box"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ8Kj77fhuLL4hzygvmwCkOXRoeWRAnvp2arinnTC1gcg&s=10" alt=""></div>
            <div class="box">box</div>
            <div class="box">box</div>
            <div class="box">box</div>
        </div>
    </div>
</body>
</html>
