    <h2 style="color: blue;">Break and Continue </h2>
    <h2 id="demo">Break And Continue </h2>
    <script>
        let text ="";
        for (i=0 ; i<11 ; i++){
            if (i==2 || i== 4 ){continue}

        }
        document.getElementById("demo").innerHTML=text;
    </script>
